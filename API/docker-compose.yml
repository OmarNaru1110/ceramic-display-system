version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ceramic-display-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Password123 -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ceramic-network

  sqlserver-configurator:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ceramic-db-configurator
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - SA_PASSWORD=YourStrong@Password123
    command: >
      /bin/bash -c "
      echo 'Waiting for SQL Server to be fully ready...';
      sleep 10;
      echo 'Creating database ceramic-display-db...';
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P YourStrong@Password123 -C -Q \"
      IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'ceramic-display-db')
      BEGIN
          CREATE DATABASE [ceramic-display-db];
      END
      \";
      "
    networks:
      - ceramic-network
    restart: "no"

  adminer:
    image: adminer:latest
    container_name: adminer-ui
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=sqlserver
    depends_on:
      - sqlserver
    networks:
      - ceramic-network
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: minio-storage
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - ceramic-network
    restart: unless-stopped

  createbucket:
    image: minio/mc:latest
    container_name: minio-createbucket
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin password123;
      mc mb -p local/ceramic-display-system-bucket || true;
      echo '✅ Bucket ceramic-display-system-bucket created (or already exists)';
      exit 0;
      "
    networks:
      - ceramic-network
    restart: "no"

  webapi:
    build:
      context: .
      dockerfile: API/dockerfile
    container_name: ceramic-display-webapi
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_started
      createbucket:
        condition: service_completed_successfully
    ports:
      - "5000:80"
    networks:
      - ceramic-network
    restart: unless-stopped
    environment:
      # ASP.NET Core setup
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80

      # ----------------------
      # 🔐 JWT Configuration
      # ----------------------
      - JWT__Issuer=https://ceramic-display.local
      - JWT__Audience=https://ceramic-display.local
      - JWT__Key=SuperStrongSecretKeyThatShouldBeLong
      - JWT__ExpiryInMinutes=60

      # ----------------------
      # 🗄️ Database Connection
      # ----------------------
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=ceramic-display-db;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;Encrypt=True;

      # ----------------------
      # 🪣 AWS/MinIO Configuration
      # ----------------------
      - AWS__AccessKey=admin
      - AWS__SecretKey=password123
      - AWS__Profile=default
      - AWS__Region=us-east-1
      - AWS__S3__BucketName=ceramic-display-system-bucket
      - AWS__S3__Region=us-east-1
      - AWS__S3__ServiceURL=http://minio:9000

      # ----------------------
      # 👨‍💼 Default Admin Creation (Optional)
      # ----------------------
      - DefaultAdmin__Email=admin@ceramic.local
      - DefaultAdmin__Password=Admin@123
      - DefaultAdmin__UserName=Admin

      # ----------------------
      # 📜 Serilog (Optional)
      # ----------------------
      - Serilog__MinimumLevel__Default=Information
      - Serilog__WriteTo__0__Name=Console
      
      # ----------------------
      # 👨‍💼 Refresh token Cleanup
      # ----------------------
      - RefreshTokenCleanup__IntervalHours=1
      - RefreshTokenCleanup__InitialDelayMinutes=1
volumes:
  sqlserver_data:
  minio-data:

networks:
  ceramic-network:
    driver: bridge
